<style>

--verde-claro:#EDF5E6;

--cafe:#70543E;
--cafe-claro:#D8C3A5;

--blanco:#ffffff;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
background:var(--verde-claro);
}

/* HEADER */

.header{

background:white;

padding:15px;

text-align:center;

box-shadow:0 2px 8px rgba(0,0,0,0.1);

}

.logo{

width:auto;

height: 70px;

}

.titulo{

margin-top:10px;

font-size:28px;

font-weight:bold;

color:var(--verde-principal);

}

/* ESTRUCTURA */

.container{

display:flex;

min-height:100vh;

}

/* MENÚ */

.menu{

width:280px;

background:var(--cafe);

padding:15px;

}

.menu h3{

color:white;

margin-bottom:10px;

margin-top:15px;

}

.menu button{

width:100%;

padding:12px;

margin-bottom:8px;

border:none;

border-radius:8px;

background:var(--verde-principal);

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.menu button:hover{

background:#366100;

}

.admin{

background:#8B0000 !important;

}

.admin:hover{

background:#660000 !important;

}

/* CONTENIDO */

.content{

flex:1;

padding:20px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 0 12px rgba(0,0,0,0.1);

}

.card h2{

color:var(--verde-principal);

margin-bottom:15px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}

label{

display:block;

margin-bottom:5px;

font-weight:bold;

color:#444;

}

input,
select,
textarea{

width:100%;

padding:10px;

border:1px solid #ccc;

border-radius:8px;

}

textarea{

resize:vertical;

min-height:100px;

}

.btnGuardar{

margin-top:20px;

background:var(--verde-principal);

color:white;

padding:12px 25px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.btnGuardar:hover{

background:#366100;

}

/* RESPONSIVE */

@media(max-width:768px){

.container{

flex-direction:column;

}

.menu{

width:100%;

}

.content{

padding:10px;

}

.logo{

max-width:280px;

}

.titulo{

font-size:22px;

}

}

</style>

</head>
